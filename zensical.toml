[project]
site_name = "RadModeling"
site_description = "CAD preparation and CAD-to-MCNP quality assurance"
site_author = "Alvaro Cubi"
site_url = "https://radmodeling.readthedocs.io/"
repo_url = "https://github.com/Fusion4Energy/RadModeling"
repo_name = "Fusion4Energy/RadModeling"
edit_uri = "edit/master/docs/"
copyright = "&copy; 2026 Alvaro Cubi &middot; EUPL-1.2"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Workflow" = "workflow.md" },
  { "Commands" = "commands.md" },
  { "SpaceClaim tools" = "spaceclaim.md" },
  { "MCNP support" = "mcnp_support.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Colours: F4E blue (primary) with the amber of the Gitronics trefoil (accent),
# set in extra.css
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
