name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags give the package version
      - uses: astral-sh/setup-uv@v6
      # .venv from uv.lock: the one pyright is configured to read
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright src tests
      - run: uv run --no-sync pytest
