[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "radmodeling"
dynamic = ["version"]
description = "CAD preparation and CAD-to-MCNP quality assurance tools"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Alvaro Cubi" }]
requires-python = ">=3.10"
keywords = ["MCNP", "CAD", "STEP", "GEOUNED", "radiation transport", "neutronics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "cadquery-ocp-novtk>=7.8",
    "migjorn>=0.3.11",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "typer>=0.12",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Documentation = "https://radmodeling.readthedocs.io"
Source = "https://github.com/Fusion4Energy/RadModeling"
Issues = "https://github.com/Fusion4Energy/RadModeling/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "cadquery-ocp-stubs>=7.8", "pyright>=1.1.380"]
docs = ["zensical>=0.0.67"]

[project.scripts]
radmod = "radmodeling.cli:app"

[tool.hatch.version]
# from the git tags (v2.0.0 -> 2.0.0); builds without git history get the fallback
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.sdist]
include = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/radmodeling", "src/radmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# SpaceClaim scripts run in IronPython with names injected by SpaceClaim
venvPath = "."
venv = ".venv"
exclude = ["src/radmodeling/spaceclaim", ".venv"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# IronPython 2.7 scripts run inside SpaceClaim, where the API names are injected globals
"src/radmodeling/spaceclaim/*.py" = ["F821", "UP", "B", "SIM"]
